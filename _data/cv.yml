    - title: Postdoctoral Researcher
      institution: University of Fribourg, Switzerland
      year: January 2025 - November 2025
      description:
        - Supervisor: Prof. Guillermo P. Acuna
        - Surface engineering and self-assembly of high-index silicon nanoparticles (SiNPs) for DNA-programmed crystallization.
        - DNA origami-directed assembly of SiNP dimers for chiral sensing.

    - title: Juan de la Cierva Fellow
      institution: Centro de Física de Materiales (CFM), Spain
      year: January 2023 - December 2024
      description:
        - Supervisor: Prof. Marek Grzelczak
        - Applied Bayesian optimization, machine learning, and automation to understand gold nanorod growth.
        - Designed DNA-coated gold nanoparticles for hydrodynamic oscillations.
        - Developed a self-driving platform for closed-loop gold bipyramid synthesis.

    - title: Postdoctoral Researcher
      institution: CIC biomaGUNE, Spain
      year: September 2020 - November 2022
      description:
        - Supervisor: Prof. Luis M. Liz-Marzán
        - Formed AuNR–quantum dot assemblies using nanoscale forces.
        - Investigated plasmon-enhanced emission and photothermal heating.
        - Integrated bottom-up and top-down fabrication strategies.

    - title: Graduate Research Assistant
      institution: IISER Pune, India
      year: 2015 - 2020
      description:
        - Demonstrated control over interparticle interactions to improve and induce emergent properties in AuNP systems.
        - Designed reusable and selective nanoparticle-based sensors.
        - Developed transient self-assembled nanoparticle systems.
        - Mentored undergraduate research students.

